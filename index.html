<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

         add nonces for its own injected IPC scripts; a hand-written meta tag here
         would not get those nonces and would block Tauri's own bootstrap. -->

  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
